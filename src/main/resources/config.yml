# ============================================================================
#  SHIslandHolo : conseils en hologramme sur l'île du joueur
# ============================================================================
#
#  Quand un joueur se trouve sur sa propre île, un hologramme FancyHolograms
#  visible de lui seul y affiche le premier conseil de tips.yml qui lui
#  correspond (niveau de l'île, nombre de membres, placeholders).
#
#  Clic gauche sur l'hologramme : cache ce conseil, le suivant prend sa place.
#  Clic droit : lance la commande du conseil (clé « click »), ou le cache
#  s'il n'en a pas. Les conseils cachés sont retenus par joueur.
#
#  L'hologramme se place devant le point d'apparition de l'île (/is sethome),
#  à portée de clic du joueur qui y arrive. Quand des blocs occupent sa place,
#  il prend la place libre la plus proche (section « placement »).
#
#  Commandes :
#    /conseil (alias /conseils)  Réaffiche tous les conseils cachés.
#    /conseil cacher             Cache le conseil affiché (joueurs Bedrock, sans clic).
#    /shislandholo reload        Recharge config.yml, tips.yml et messages.yml.
#                                Un fichier invalide annule le rechargement : l'ancienne
#                                configuration et les hologrammes restent en place.
#
#  Permissions :
#    shislandholo.conseil        /conseil (tout le monde par défaut)
#    shislandholo.admin          Toutes les commandes d'administration (op par défaut)
#    shislandholo.admin.reload   /shislandholo reload
#
#  Fichiers :
#    config.yml    réglages (ce fichier)
#    tips.yml      les conseils et leurs conditions
#    messages.yml  les messages du chat
# ============================================================================

# Intervalle, en secondes, entre deux vérifications de la position des joueurs
# et du conseil qui leur correspond.
refresh-seconds: 3

hologram:
  # Place de l'hologramme :
  #   home    devant le point d'apparition de l'île (/is sethome), dans la
  #           direction de son regard : cliquable sans bouger en arrivant.
  #   center  centre de l'île + « position ».
  # Un conseil qui a sa propre position (clé « position » dans tips.yml) la
  # garde, quel que soit ce réglage.
  anchor: center
  # anchor home : distance horizontale, en blocs, entre le joueur et le milieu
  # de l'hologramme. Avec une zone cliquable de 3 de large, 3.5 met son bord à
  # 2 blocs du joueur (portée d'un clic en survie : 3 blocs).
  distance: 3.5
  # anchor home : hauteur, en blocs, du bas de l'hologramme au-dessus des
  # pieds du joueur. 0.1 garde les yeux (1.62) dans la zone cliquable dès
  # 6 lignes, et un conseil de 11 lignes sous 3 blocs de haut.
  height: 0.1
  # anchor center : position par rapport au centre de l'île (x, y, z).
  position: '0,4,8'
  # Distance, en blocs, à partir de laquelle le joueur voit l'hologramme.
  view-distance: 32
  # Orientation : CENTER (suit le regard), VERTICAL (tourne sur lui-même) ou FIXED.
  billboard: CENTER
  # Fond du texte : default (fond gris de Minecraft), transparent, ou #AARRGGBB.
  background: default
  text-shadow: true
  scale: 1.0
  # Rafraîchissement, en secondes, des placeholders écrits dans les lignes.
  placeholder-refresh-seconds: 10

placement:
  # Hologramme enfoui : à sa création, si des blocs touchent son volume, il
  # prend la place libre la plus proche. Autour du point d'apparition (à la
  # distance et à la hauteur ci-dessus) : d'abord les places encore à portée
  # de clic, devant puis de plus en plus sur le côté ou plus haut, puis les
  # plus hautes ; ensuite la même recherche autour du joueur. Une position
  # fixe (anchor center, clé « position ») monte d'abord au-dessus des blocs.
  # Rien n'est vérifié tant que l'hologramme reste affiché. Sans place
  # libre, il garde sa position.
  enabled: true
  # Largeur, en blocs, qui doit être libre autour de l'hologramme.
  # La hauteur suit le nombre de lignes du conseil.
  width: 3.0
  # Montée maximale, en blocs, au-dessus de chaque position essayée.
  max-rise: 6

click-box:
  # Zone cliquable posée sur l'hologramme (invisible, envoyée au joueur seul).
  enabled: true
  # Largeur de la zone, en blocs. La hauteur suit le nombre de lignes.
  width: 3.0
  # Hauteur d'une ligne de texte, en blocs, à l'échelle 1.
  line-height: 0.25
  # Délai minimal, en millisecondes, entre deux clics pris en compte.
  cooldown-ms: 500

new-tip:
  # Message (messages.yml : new-tip) quand un conseil jamais vu apparaît.
  # Le tout premier conseil d'un joueur n'est pas annoncé.
  announce: true
  # Son joué avec ce message. Laisser vide pour aucun son.
  sound: BLOCK_NOTE_BLOCK_PLING
  sound-volume: 0.6
  sound-pitch: 1.4
