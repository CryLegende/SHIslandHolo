# ============================================================================
#  SHIslandHolo : les conseils
# ============================================================================
#
#  Les conseils sont lus dans l'ordre du fichier : le joueur voit le premier
#  qui lui correspond et qu'il n'a pas caché. Quand il le cache (clic gauche,
#  ou /conseil cacher), le suivant prend sa place.
#
#  Clés d'un conseil (toutes facultatives sauf « lines ») :
#
#    levels      Niveau de l'île.      « 0-71 », « 150+ », « 300 »
#    members     Membres de l'île, chef compris.  « 1 », « 2+ », « 1-3 »
#    conditions  Liste de comparaisons évaluées avec PlaceholderAPI pour le
#                joueur. Toutes doivent être vraies.
#                Opérateurs : ==  !=  >=  <=  >  <  contains
#                Les nombres se comparent comme des nombres, le reste comme
#                du texte (sans tenir compte des majuscules).
#                Exemple : '%player_world% == world'
#    lines       Lignes de l'hologramme. Codes & et balises MiniMessage
#                (<gradient:...>, <b>...) acceptés, placeholders aussi.
#    click       Commande lancée par le joueur au clic droit, sans « / ».
#                Sans cette clé, le clic droit cache le conseil comme le
#                clic gauche.
#    position    Position fixe par rapport au centre de l'île, « x,y,z ».
#                Par défaut : hologram.anchor de config.yml (devant le
#                point d'apparition de l'île).
#
#  Le nom d'un conseil (bienvenue, monde...) sert à retenir ceux que le joueur
#  a cachés ou déjà vus : le renommer le fait réapparaître chez tout le monde.
# ============================================================================

tips:

  # Île de départ.
  bienvenue:
    levels: 0-9
    click: help
    lines:
      - '<b><gradient:#F48854:#FDFA8C>Bienvenue sur ton île</gradient></b>'
      - ''
      - '&7Prends le temps de faire le tour de'
      - '&7ton île : tout commence ici.'
      - ''
      - '&eClic droit &7: ouvrir l''aide'
      - '&8Clic gauche : cacher ce conseil'

  # Condition évaluée avec PlaceholderAPI, mise à jour toutes les 10 secondes.
  monde:
    levels: 10+
    conditions:
      - '%player_world% == world'
    lines:
      - '<b><gradient:#F48854:#FDFA8C>Ton monde</gradient></b>'
      - ''
      - '&e%player_world%'
      - ''
      - '&8Clic : cacher ce conseil'

  # Seul sur son île.
  inviter:
    levels: 10+
    members: 1
    lines:
      - '<b><gradient:#F48854:#FDFA8C>Joue avec tes amis</gradient></b>'
      - ''
      - '&7À plusieurs, l''île grandit &ebien plus vite&7.'
      - '&7Invite un ami avec'
      - '&e/is invite <pseudo>'
      - ''
      - '&8Clic : cacher ce conseil'

  classement:
    levels: 100+
    click: spawn
    lines:
      - '<b><gradient:#F48854:#FDFA8C>Niveau %superior_island_level%</gradient></b>'
      - ''
      - '&7Ton île compte parmi les grandes.'
      - ''
      - '&eClic droit &7: retourner au spawn'
      - '&8Clic gauche : cacher ce conseil'
